[tool.poetry]
name = "kauvery-youtube-report"
version = "0.1.0"
description = "A Python application for generating daily subscriber reports for the Kauvery Hospital YouTube channel."
authors = ["Your Name <your.email@example.com>"]
license = "MIT"

[tool.poetry.dependencies]
python = "^3.12"
requests = "^2.26.0"
pandas = "^1.3.3"
matplotlib = "^3.4.3"
reportlab = "^3.6.11"
python-dotenv = "^0.19.1"
google-api-python-client = "*"
PyMuPDF = "*"
numpy = "*"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"